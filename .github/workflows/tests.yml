# Rhea CI — minimal regression-guard for the apecx-integration fork.
#
# Scope (intentional)
# -------------------
# The vast majority of rhea's tests (tests/test_commands.py, the
# tests/mcp/ MCP-client suite, parts of tests/evals/) require live
# Postgres + Redis + MinIO + a running rhea MCP server with the
# galaxytools catalog ingested. CI containers can provide Postgres
# + Redis, but bringing up the full rhea catalog + ingest pipeline
# in a runner is multi-hour work (>1 GB of ToolShed metadata, an
# embedding-model pull, etc.).
#
# This first-cut CI verifies:
#
#   1. The package installs cleanly on Python 3.10 (matches the
#      apecx-cowork rhea/.venv toolchain).
#   2. ``pytest --collect-only`` succeeds — proves every test module
#      AND every transitively-imported production module loads
#      without raising. This is the regression-catch that would have
#      surfaced the nanobrain eager-parsl import bug, the apecx
#      missing-redis dep, etc.
#   3. The preprocess test subset (the only one not requiring DB +
#      Redis + MinIO) runs. These are HTTP-dependent (fetches Galaxy
#      tool repos from a public registry); if they prove flaky on
#      the runner network, gate them with ``continue-on-error: true``
#      or move to a separate optional job.
#
# Out of scope here (would expand later as infra is added):
#   - ``tests/test_commands.py`` (full Tool agent path; needs Redis
#     + MinIO + a fixture catalog ingested into Postgres).
#   - ``tests/mcp/`` (needs a live rhea-server on :3001).
#   - ``tests/evals/`` (LLM-driven; needs api keys).

name: tests

# Trigger on push to EVERY branch (so feature/topic branches get CI
# coverage too). Same convention as apecx-mcp-integration (which
# learned this lesson 2026-05-15: a workflow scoped to main/master
# only is effectively a placebo for the entire active-development
# window). PR triggers stay scoped to merge-target branches.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master, apecx-integration]

jobs:
  collect:
    name: install + collect-only (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install rhea (flat deps; pyproject has no extras split)
        # rhea/pyproject.toml puts everything (pytest, mkdocs, mypy,
        # parsl, conda-pack, ...) in ``dependencies`` — there is no
        # ``[project.optional-dependencies]`` split. So a plain
        # ``pip install -e .`` is the install path.
        run: |
          pip install -e .

      - name: pytest --collect-only (regression-guard for import shape)
        # Catches eager-import bombs (the dominant silent-failure
        # this CI guards against). If a refactor accidentally adds a
        # top-level ``import some_optional_pkg`` to a module that
        # gets eager-loaded via library/__init__ chains, collection
        # explodes and CI goes red — way better than discovering it
        # at first user invocation.
        run: |
          pytest --collect-only -q tests/

      - name: Run preprocess test subset (lightest infra-free path)
        # tests/preprocess/test_preprocess.py fetches Galaxy
        # tool repos via HTTP. If the runner's egress is restricted
        # this step can fail; treat as expected and we'll widen
        # later. The collect-only step above is the load-bearing
        # regression guard.
        run: |
          pytest tests/preprocess/ -q --tb=short
        # Don't fail the job on network-flaky test failure — the
        # collect step is the load-bearing guard. Remove this when
        # we have a stable HTTP-mock harness or when we add a real
        # services job with postgres + redis + minio + ingested
        # catalog.
        continue-on-error: true

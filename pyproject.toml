[project]
name = "rhea-mcp"
version = "0.1.1b5"
description = "A scalable MCP (Model Context Protocol) tool framework to serve thousands of biomedical tools for Large Language Models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # academy-py 0.4 migration completed 2026-05-16: unified Handle
    # replaces RemoteHandle + UnboundRemoteHandle; `bind_to_client`
    # replaced by ``Handle(unbound.agent_id, exchange=client)``.
    # All 4 call sites in rhea/server/{schema,utils}.py and
    # rhea/manager/{run,run_test,utils}.py updated.
    "academy-py>=0.4,<0.5",
    # aiofiles: imported by rhea/agent/utils.py::configure_tool_directory
    # (async tool-file staging from MinIO). Was UNDECLARED — the host dev
    # venv carried it transitively, masking the gap, but a clean `uv sync`
    # (the Docker build) omitted it and the Parsl worker crashed with
    # `ModuleNotFoundError: No module named 'aiofiles'` during agent startup.
    "aiofiles>=23.0.0",
    "asyncpg>=0.30.0",
    "black>=25.1.0",
    "cachetools>=6.1.0",
    "cheetah3>=3.2.6.post1",
    "conda-pack>=0.8.1",
    "coverage[toml]>=7.9.1",
    "debugpy>=1.8.14",
    "fastapi[standard]>=0.115.14",
    "filetype>=1.2.0",
    "genbadge[all]>=1.1.2",
    "greenlet>=3.2.3",
    "griffe-inherited-docstrings>=1.1.1",
    "kubernetes>=33.1.0",
    "matplotlib>=3.10.5",
    "mcp[cli]>=1.10.1",
    "minio>=7.2.15",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.2",
    "mkdocs-material>=9.6.17",
    "mkdocs-mermaid2-plugin>=1.2.1",
    "mkdocstrings[python]>=0.30.0",
    "mypy>=1.16.1",
    "openai>=1.93.0",
    "parsl>=2025.6.23",
    "pgvector>=0.4.1",
    "prometheus-client>=0.22.1",
    # proxystore[redis] (NOT [all]): rhea-server + agent use ONLY the
    # Redis connector + core Store (verified: every proxystore import in
    # rhea/ is proxystore.connectors.redis.RedisConnector / .store). The
    # [all] extra dragged in aiortc -> av (WebRTC, unused), and av 14.4.0
    # ships sdist-only on this lock — it source-builds and REQUIRES
    # ffmpeg 7, which Debian bookworm (the uv base image) does not carry,
    # breaking `docker build`. Narrowing to [redis] drops av entirely.
    "proxystore[redis]>=0.8.2",
    "psycopg2-binary>=2.9.10",
    # pydantic-settings: rhea/server/schema.py::Settings subclasses
    # pydantic_settings.BaseSettings. Was relied on transitively (via
    # fastapi/mcp); declared explicitly so a clean install cannot drop it.
    "pydantic-settings>=2.0.0",
    "pymdown-extensions>=10.16.1",
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.8.0",
    "python-magic>=0.4.27",
    "requests>=2.32.4",
    "shellcheck-py>=0.10.0.1",
    "sqlalchemy>=2.0.41",
    "tqdm>=4.67.1",
    "trio>=0.30.0",
    "zstandard>=0.23.0",
]

# Without a [build-system] table, uv treats this project as VIRTUAL: it
# installs the dependencies but never builds/installs `rhea` itself, so the
# package is importable only from the repo root (CWD on sys.path). That is
# invisible for the server (CWD=/app) but FATAL for the Parsl worker
# subprocess, which runs from a different CWD and crashes with
# `ModuleNotFoundError: No module named 'rhea'`. Declaring the build backend
# makes `uv sync` install rhea into the venv site-packages, so any
# subprocess (worker, conda run, tests) can import it regardless of CWD.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rhea*"]
